{% extends "layout.html" %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="page-hero mb-4">
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-3">
            <div>
                <h1 class="mb-1">Browse Spelling Words</h1>                
            </div>            
        </div>
    </div>

    <!-- Filter Box -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="glass-card p-3">
                <div class="input-group input-group-lg">
                    <input type="text" 
                           id="filter-input"
                           class="form-control" 
                           placeholder="Type to filter words instantly..." 
                           autofocus>
                    <div class="input-group-append">
                        <button type="button" class="soft-btn ghost-btn" onclick="clearFilter()">Clear</button>
                        <button type="button" class="soft-btn soft-primary" onclick="refreshCache()">🔄 Refresh Cache</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Word Preview/Summary -->
        <div class="col-md-8">
            <div class="card glass-card h-100">
                <div class="card-header soft-glass d-flex align-items-center" id="word-preview-bar" style="min-height: 44px; padding: 0.4rem 1rem; border-radius: 1.2rem 1.2rem 0 0; border-bottom: 1px solid #e0e4ea; background: rgba(255,255,255,0.85);">
                    <button id="nav-prev" class="soft-btn soft-outline small-btn me-2" title="Previous word" style="min-width:32px;">←</button>
                    <span id="word-preview-bar-text" class="flex-fill" style="font-size: 1.05em; font-weight: 500; letter-spacing: 0.01em; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Click on a word to see its preview</span>
                    <button id="nav-next" class="soft-btn soft-outline small-btn ms-2" title="Next word" style="min-width:32px;">→</button>
                </div>
                <div id="word-summary" class="soft-glass" style="border-radius: 0 0 1.2rem 1.2rem; min-height: 140px; background: rgba(255,255,255,0.6); border-top: none; padding: 0;"></div>
            </div>
        </div>

        <!-- Word List -->
        <div class="col-md-4">
            <div class="card glass-card word-list-card" style="height: 100vh; min-height: 400px; display: flex; flex-direction: column;">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <span class="soft-card-title">📚 Words List</span>
                    <span class="badge-chip">{{ total_words }} entries</span>
                </div>
                <div class="list-group list-group-flush flex-grow-1" id="words-list" style="overflow-y: auto; padding: 0.8rem; height: 100%;">
                    {% for word_item in words %}
                    <div class="list-group-item list-group-item-action word-link py-1 px-2" 
                       style="display: flex; flex-direction: row; align-items: center; gap: 8px; cursor: pointer;"
                       data-word-dir="{{ word_item.dir_name }}"
                       data-word="{{ word_item.word }}"
                       data-yaml='{{ word_item.data | tojson }}'
                       onclick="loadWordSummary('{{ word_item.dir_name }}', this);">
                        <span class="word-title" style="flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ word_item.word }}</span>
                        <a href="/word/{{ word_item.dir_name }}" 
                           class="soft-btn soft-outline small-btn"
                           style="flex: 0 0 auto; padding: 2px 10px; font-size: 0.92em; line-height: 1.2;"
                           onclick="event.stopPropagation();">View →</a>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Store all words for filtering
let allWords = [];
let currentWordIndex = 0;

// Load words on page load
document.addEventListener('DOMContentLoaded', function() {
    // Get all word links
    const wordLinks = document.querySelectorAll('.word-link');
    allWords = Array.from(wordLinks).map(link => ({
        element: link,
        word: link.dataset.word,
        dir: link.dataset.wordDir,
        yaml: link.dataset.yaml
    }));

    // Set up live filtering
    const filterInput = document.getElementById('filter-input');
    filterInput.addEventListener('input', filterWords);

    // Navigation button handlers
    document.getElementById('nav-prev').addEventListener('click', function() {
        navigateWord(-1);
    });
    document.getElementById('nav-next').addEventListener('click', function() {
        navigateWord(1);
    });

    // Keyboard arrow navigation
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') {
            navigateWord(-1);
        } else if (e.key === 'ArrowRight') {
            navigateWord(1);
        }
    });

    // Load first word by default
    if (allWords.length > 0) {
        currentWordIndex = 0;
        loadWordSummary(allWords[0].dir, allWords[0].element);
    }
    updateNavButtons();
});

function filterWords() {
    const filterValue = document.getElementById('filter-input').value.toLowerCase();
    let visibleCount = 0;
    
    allWords.forEach(wordObj => {
        const matches = wordObj.word.toLowerCase().includes(filterValue);
        
        if (matches) {
            wordObj.element.style.display = '';
            visibleCount++;
        } else {
            wordObj.element.style.display = 'none';
        }
    });
    
    document.getElementById('filtered-count').textContent = visibleCount;
    updateNavButtons();
}

function clearFilter() {
    document.getElementById('filter-input').value = '';
    filterWords();
}

// Navigation helpers (top-level so arrow keys and buttons always work)
function getVisibleIndices() {
    const indices = [];
    for (let i = 0; i < allWords.length; i++) {
        const el = allWords[i].element;
        if (!el) continue;
        if (el.style.display !== 'none') indices.push(i);
    }
    return indices;
}

function updateNavButtons() {
    const visible = getVisibleIndices();
    const prevBtn = document.getElementById('nav-prev');
    const nextBtn = document.getElementById('nav-next');
    if (!prevBtn || !nextBtn) return;
    if (!visible.length) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
    }
    const pos = visible.indexOf(currentWordIndex);
    prevBtn.disabled = (pos <= 0);
    nextBtn.disabled = (pos === -1 || pos >= visible.length - 1);
}

function navigateWord(direction) {
    const visible = getVisibleIndices();
    if (!visible.length) return;
    let pos = visible.indexOf(currentWordIndex);
    if (pos === -1) pos = (direction > 0) ? 0 : visible.length - 1;
    else pos = Math.max(0, Math.min(visible.length - 1, pos + direction));
    const newIndex = visible[pos];
    if (newIndex !== currentWordIndex) {
        currentWordIndex = newIndex;
        loadWordSummary(allWords[newIndex].dir, allWords[newIndex].element);
        // Removed scrollIntoView to prevent viewport jump
    }
}

function loadWordSummary(wordDir, element) {
    // Update active state and current index
    document.querySelectorAll('.word-link').forEach(link => link.classList.remove('active'));
    if (element) {
        element.classList.add('active');
        // Update currentWordIndex
        for (let i = 0; i < allWords.length; i++) {
            if (allWords[i].element === element) {
                currentWordIndex = i;
                break;
            }
        }
    }
    updateNavButtons();

    fetch(`/word_summary/${wordDir}`)
        .then(response => response.json())
        .then(data => {
            let html = '';
            if (data.error) {
                html = `<p class="text-danger">${data.error}</p>`;
                document.getElementById('word-preview-bar-text').textContent = '';
            } else {
                // No explanation or definition at the top

                // Find initial_generated_2 image for main preview
                let mainImg = null;
                if (data.images && data.images.length) {
                    mainImg = data.images.find(i => i.filename && i.filename.toLowerCase().startsWith('initial_generated_2')) || data.images[0];
                }
                // Set preview bar text
                document.getElementById('word-preview-bar-text').textContent = data.word + (data.word_dir ? ' (' + data.word_dir + ')' : '');

                // Build four-column preview: main image | thumbnails | files | info/actions
                html += `<div class="preview-region" style="display: grid; grid-template-columns: 220px repeat(3, minmax(140px,1fr)); gap: 1rem; align-items: start;">`;
                // Column 1: Main preview image
                html += `<div class=\"preview-main\" style=\"width: 210px;\">`;
                if (mainImg) {
                    html += `<div class="thumb-img text-center" style="width: 200px; height: 200px; border-radius: 12px; background: #f7f8fa; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; cursor: pointer;" onclick="showImageModal('/serve_file/${encodeURIComponent(mainImg.path)}', ${JSON.stringify(mainImg.filename)})">`;
                    html += `<img src="/serve_file/${encodeURIComponent(mainImg.path)}" alt=${JSON.stringify(mainImg.filename)} style="max-width: 190px; max-height: 190px; object-fit: contain;">`;
                    html += `</div>`;
                    html += `<div class='text-center' style='margin-bottom: 12px;'><button class='soft-btn soft-danger' onclick=\"(function(e){e.stopPropagation();deletePreviewImage('` + mainImg.path + `', this);})(event)\">🗑️ Delete Image</button></div>`;
                } else {
                    html += `<div class="text-muted small">No preview image</div>`;
                }
                html += `</div>`;

                // Column 2: Thumbnails
                html += `<div class="preview-thumbs">`;
                if (data.images && data.images.length) {
                    html += `<div class="preview-images" style="display: flex; flex-direction: column; gap: 8px;">`;
                    data.images.forEach(img => {
                        html += `<div class="thumb" data-path="${img.path}" style="display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer;" onclick="if(event.target.classList.contains('soft-danger')) return; showImageModal('/serve_file/${encodeURIComponent(img.path)}', ${JSON.stringify(img.filename)})">`;
                        html += `<div class="thumb-img text-center" style="width: 48px; height: 48px; border-radius: 6px; background: #f7f8fa; display: flex; align-items: center; justify-content: center;">`;
                        html += `<img src="/serve_file/${encodeURIComponent(img.path)}" alt=${JSON.stringify(img.filename)} style="max-width: 44px; max-height: 44px; object-fit: contain;">`;
                        html += `</div>`;
                        html += `<button class='soft-btn soft-danger' style='margin-left: 8px;' onclick=\"(function(e){e.stopPropagation();deletePreviewImage('` + img.path + `', this);})(event)\">🗑️</button>`;
                        html += `<div style="font-size: 0.9em; color: #444; margin-left: 8px;">${img.filename.replace(/'/g, "&#39;")}</div>`;
                        html += `</div>`;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="text-muted small">No other images</div>`;
                }
                html += `</div>`;

                // Column 3: Files
                html += `<div class="preview-files">`;
                if (data.files && data.files.length) {
                    html += `<div class="mb-2 small"><strong>Files:</strong></div><ul class="list-unstyled small compact-file-list" style="display: flex; flex-direction: column; gap: 6px;">`;
                    data.files.forEach(f => {
                        html += `<li style="display: flex; align-items: center; gap: 8px;"><span style="flex:1 1 auto;">${f.filename}</span> <span class="text-muted">(${Math.round(f.size/1024)} KB)</span> <a class="soft-btn soft-outline small-btn" href="/serve_file/${f.path}" download>⬇️</a></li>`;
                    });
                    html += `</ul>`;
                } else {
                    html += `<div class="text-muted small">No files</div>`;
                }
                html += `</div>`;

                // Column 4: Explanation / Actions
                html += `<div class="preview-info">`;
                html += `<div class='d-flex gap-2 mb-3' style='justify-content: flex-end;'>`;
                html += `<a href="/word/${data.word_dir}" class="soft-btn soft-primary flex-fill">View Full Details →</a>`;
                html += `<button class="soft-btn soft-danger flex-fill" onclick="deleteAllExceptYamlPreview('${data.word_dir}', '${data.word}'); return false;">🗑️ Delete Everything</button>`;
                html += `</div>`;
                if (data.definition) {
                    html += `<div class=\"alert alert-warning py-1 small\"><strong>Definition:</strong><p class=\"mb-0\">${data.definition}</p></div>`;
                }
                html += `</div>`;
                html += `</div>`;
            }
            document.getElementById('word-summary').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('word-summary').innerHTML = `<p class="text-danger">Error loading summary: ${err}</p>`;
        });

    // Set fixed height and scroll for preview window
    const wordSummary = document.getElementById('word-summary');
    if (wordSummary) {
        wordSummary.style.maxHeight = '350px';
        wordSummary.style.minHeight = '350px';
        wordSummary.style.overflowY = 'auto';
    }
}

// Modal for full image preview
function showImageModal(imgUrl, imgName) {
    // Remove any existing modal
    const existing = document.getElementById('image-preview-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'image-preview-modal';
    modal.innerHTML = `
        <div class="modal-backdrop" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(30,30,40,0.7); z-index: 2000; display: flex; align-items: center; justify-content: center;">
            <div class="modal-content" style="background: #fff; border-radius: 12px; box-shadow: 0 4px 32px rgba(0,0,0,0.18); padding: 1.5rem; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;">
                <img id="modal-img" src="${imgUrl}" alt="${imgName}" style="max-width: 80vw; max-height: 80vh; object-fit: contain; border-radius: 8px; margin-bottom: 1rem;">
                <div style="font-size: 1.1em; color: #333; margin-bottom: 0.5rem;">${imgName}</div>
                <div class="d-flex gap-2"><a href="${imgUrl}" class="soft-btn soft-outline" download>Download</a><button onclick="document.getElementById('image-preview-modal').remove()" class="soft-btn soft-danger">Close</button></div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function deletePreviewImage(imagePath, buttonElem) {
    if (!confirm('Delete this image?')) return;
    console.log('[deletePreviewImage] imagePath:', imagePath);
    const url = '/delete_image/' + encodeURIComponent(imagePath);
    fetch(url, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                // reload active word summary
                const active = document.querySelector('.word-link.active');
                if (active) loadWordSummary(active.dataset.wordDir, active);
                else alert(data.message);
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(err => alert('Error deleting image: ' + err));
}

function deleteAllExceptYamlPreview(wordDir, word) {
    if (!confirm(`Delete everything for "${word}" except working.yaml? This cannot be undone.`)) return;
    if (!confirm('FINAL CONFIRMATION: delete everything?')) return;
    fetch(`/delete_all_except_yaml/${wordDir}`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                const active = document.querySelector('.word-link.active');
                if (active) loadWordSummary(active.dataset.wordDir, active);
                else window.location.reload();
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(err => alert('Error: ' + err));
}

function refreshCache() {
    if (!confirm('Refresh cache and reload all word data from disk?')) return;
    fetch('/refresh_cache', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                alert(data.message + '\n\nPage will reload.');
                window.location.reload();
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(err => alert('Error refreshing cache: ' + err));
}

// Page-specific styles for preview layout
const styleEl = document.createElement('style');
styleEl.textContent = `
.preview-region { display: grid; gap: 1rem; align-items: start; }
.preview-main .thumb-img { transition: transform 0.12s ease-in-out; }
.preview-main .thumb-img:hover { transform: scale(1.02); }
.preview-thumbs .thumb { cursor: pointer; }
.preview-thumbs .thumb:hover { background: rgba(0,0,0,0.02); }
@media (max-width: 900px) { .preview-region { grid-template-columns: 1fr !important; } .preview-main { width: 100% !important; text-align: center; } }
`;
document.head.appendChild(styleEl);
</script>

{% endblock %}
