oomlout_ai_roboclick_1:
    actions:
    -   command: new_chat
        description: research_day_of_the_year
    -   command: ai_query
        delay: '120'
        folder_name: roboclick\ai_data_source_calendar_date\research_day_of_the_year
        mode_ai_wait: slow
    -   command: ai_query
        mode_ai_wait: slow
        text: if the above output is yaml please put it in the reply, if it is not
            please summarize the above information in a yaml format and only return
            the yaml without any other text. The yaml should be in the format of a
            dictionary with keys and values. The keys should be descriptive of the
            information they contain. The values should be the information itself.
            Please make sure the yaml is between two &&&tag for copy&&& strings
    -   command: ai_save_text
        file_name_clip: research_raw.yaml
        file_name_full: research_full.txt
    -   command: ai_fix_yaml_copy_paste
        file_destination: research.yaml
        file_source: research_raw.yaml
        new_item_name: date_type
        remove_top_level: data
    -   command: close_tab
    -   command: create_text_file
        content: Tag for research_day_of_the_year completed.
        file_name: aaaa_research_day_of_the_year_tag_done.txt
    file_test: aaaa_research_day_of_the_year_tag_done.txt
